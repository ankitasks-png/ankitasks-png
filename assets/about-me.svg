  </text>

  <text x="210.0" y="54.6" text-anchor="middle" class="txt_about_me" font-size="30"
        fill="url(#grad_about_me)" filter="url(#glow)">
    🚀 About Me
    <animate attributeName="x" values="210.0;207.5;212.5;209.0;210.0" dur="0.18s" begin="1.8s;3.9s;5.7s" repeatCount="1" fill="freeze"/>
  </text>
