    </filter>
    <linearGradient id="grad_about_me" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#8A2BE2"/>
    </linearGradient>
  </defs>

  <style>
    .txt_about_me { font-family: 'Consolas','Courier New',monospace; font-weight: 800; letter-spacing: 2px; }
  </style>

  <path d="M 30 10.799999999999999 L 20 39.0 L 32 39.0 L 16 79.2 L 46 49.0 L 32 49.0 L 44 10.799999999999999 Z" fill="#8A2BE2" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="1;0.15;0.9;0.1;1" dur="1.3s" begin="0.0s" repeatCount="indefinite"/>
  </path>
  <path d="M 390 10.799999999999999 L 400 39.0 L 388 39.0 L 404 79.2 L 374 49.0 L 388 49.0 L 376 10.799999999999999 Z" fill="#8A2BE2" filter="url(#glow)" opacity="0.9">
    <animate attributeName="opacity" values="1;0.15;0.9;0.1;1" dur="1.3s" begin="0.4s" repeatCount="indefinite"/>
  </path>

  <text x="210.0" y="54.6" text-anchor="middle" class="txt_about_me" font-size="30"
        fill="#8A2BE2" filter="url(#glowStrong)" opacity="0.85">
    <animate attributeName="opacity" values="0.9;0.25;1;0.4;0.95;0.15;1" dur="2.6s" repeatCount="indefinite"/>
