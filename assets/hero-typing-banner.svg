<svg viewBox="0 0 700 150" width="700" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="50%" stop-color="#1a1440"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .code { font-family: 'JetBrains Mono','Fira Code',monospace; fill: #8A2BE2; }
      .typed { font-family: 'Fira Code',monospace; font-size: 17px; fill: #8A2BE2; }
    </style>

    <clipPath id="clip0"><rect x="20" y="65" height="30" width="0">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.08;0.13;0.2;1" values="0;479;479;0;0"/>
    </rect></clipPath>
    <clipPath id="clip1"><rect x="20" y="65" height="30" width="0">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.2;0.28;0.33;0.4;1" values="0;0;592;592;0;0"/>
    </rect></clipPath>
    <clipPath id="clip2"><rect x="20" y="65" height="30" width="0">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.4;0.48;0.53;0.6;1" values="0;0;418;418;0;0"/>
    </rect></clipPath>
    <clipPath id="clip3"><rect x="20" y="65" height="30" width="0">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.6;0.68;0.73;0.8;1" values="0;0;316;316;0;0"/>
    </rect></clipPath>
    <clipPath id="clip4"><rect x="20" y="65" height="30" width="0">
      <animate attributeName="width" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.8;0.88;0.93;1" values="0;0;459;459;0"/>
    </rect></clipPath>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="700" height="150" rx="14" fill="url(#bgGrad)"/>
  <circle cx="600" cy="30" r="80" fill="url(#glow)">
    <animate attributeName="r" values="70;95;70" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="90" cy="130" r="70" fill="url(#glow)">
    <animate attributeName="r" values="60;85;60" dur="5s" repeatCount="indefinite"/>
  </circle>

  <!-- circuit lines -->
  <g stroke="#00F0FF" stroke-width="1" opacity="0.35" fill="none">
    <path d="M0,20 H120 L140,40 H260">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3s" repeatCount="indefinite"/>
    </path>
    <path d="M700,110 H580 L560,90 H420" stroke-dasharray="6 6">
      <animate attributeName="stroke-dashoffset" from="0" to="-40" dur="3.5s" repeatCount="indefinite"/>
    </path>
    <path d="M0,130 H60 L80,110 H160" stroke-dasharray="5 5">
      <animate attributeName="stroke-dashoffset" from="0" to="-30" dur="2.7s" repeatCount="indefinite"/>
    </path>
  </g>
  <circle cx="120" cy="20" r="2.5" fill="#00F0FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2s" repeatCount="indefinite"/></circle>
  <circle cx="260" cy="40" r="2.5" fill="#8A2BE2"><animate attributeName="opacity" values="1;0.3;1" dur="2.4s" repeatCount="indefinite"/></circle>
  <circle cx="580" cy="110" r="2.5" fill="#00F0FF"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite"/></circle>
  <circle cx="420" cy="90" r="2.5" fill="#8A2BE2"><animate attributeName="opacity" values="1;0.3;1" dur="2.6s" repeatCount="indefinite"/></circle>

  <!-- floating code symbols -->
  <g>
    <text x="30" y="45" class="code" font-size="16" opacity="0.5">{ }</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-10;0,0" dur="4s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="650" y="40" class="code" font-size="15" opacity="0.45">01</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,12;0,0" dur="5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="640" y="130" class="code" font-size="14" opacity="0.4">10</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,-8;0,0" dur="3.5s" repeatCount="indefinite"/>
  </g>
  <g>
    <text x="20" y="130" class="code" font-size="15" opacity="0.4">&lt;/&gt;</text>
    <animateTransform attributeName="transform" type="translate" values="0,0;0,8;0,0" dur="4.5s" repeatCount="indefinite"/>
  </g>

  <!-- typewriter lines: revealed left-to-right via growing clip window, then deleted -->
  <text x="20" y="87" class="typed" clip-path="url(#clip0)">BTech Third Year CSE Student @ PES University</text>
  <text x="20" y="87" class="typed" clip-path="url(#clip1)">Software Development | Machine Learning | Cyber Security</text>
  <text x="20" y="87" class="typed" clip-path="url(#clip2)">Exploring the world of Quantum Computing</text>
  <text x="20" y="87" class="typed" clip-path="url(#clip3)">Musician | Athlete | Innovator</text>
  <text x="20" y="87" class="typed" clip-path="url(#clip4)">Always Open To Research Work And Internships</text>

  <!-- blinking cursor that tracks the typing edge of the active line -->
  <g>
    <animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite"
      keyTimes="0;0;0.2" values="0;1;0"/>
    <rect y="68" width="2.5" height="20" fill="#00F0FF">
      <animate attributeName="x" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.08;0.13;0.2;1" values="20;499;499;20;20"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite"
      keyTimes="0;0.2;0.4" values="0;1;0"/>
    <rect y="68" width="2.5" height="20" fill="#00F0FF">
      <animate attributeName="x" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.2;0.28;0.33;0.4;1" values="20;20;612;612;20;20"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite"
      keyTimes="0;0.4;0.6" values="0;1;0"/>
    <rect y="68" width="2.5" height="20" fill="#00F0FF">
      <animate attributeName="x" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.4;0.48;0.53;0.6;1" values="20;20;438;438;20;20"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite"
      keyTimes="0;0.6;0.8" values="0;1;0"/>
    <rect y="68" width="2.5" height="20" fill="#00F0FF">
      <animate attributeName="x" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.6;0.68;0.73;0.8;1" values="20;20;336;336;20;20"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g>
    <animate attributeName="opacity" calcMode="discrete" dur="15s" repeatCount="indefinite"
      keyTimes="0;0.8;1" values="0;1;0"/>
    <rect y="68" width="2.5" height="20" fill="#00F0FF">
      <animate attributeName="x" dur="15s" repeatCount="indefinite"
        keyTimes="0;0.8;0.88;0.93;1" values="20;20;479;479;20"/>
      <animate attributeName="opacity" values="1;0;1" dur="0.6s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
