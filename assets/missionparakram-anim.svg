<svg viewBox="0 0 300 180" width="240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="300" height="180" fill="#0f0c29" rx="12"/>

  <!-- connecting lines from corners to hub -->
  <line x1="24" y1="24" x2="150" y2="90" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="276" y1="24" x2="150" y2="90" stroke="#00F0FF" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>
  <line x1="150" y1="160" x2="150" y2="90" stroke="#FFD700" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.5"/>

  <!-- hub glow -->
  <circle cx="150" cy="90" r="34" fill="url(#hubGlow)">
    <animate attributeName="r" values="28;38;28" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- hub core -->
  <circle cx="150" cy="90" r="16" fill="#302b63" stroke="#00F0FF" stroke-width="2"/>
  <text x="150" y="96" font-size="16" text-anchor="middle">🛰️</text>

  <!-- Army stream (top-left) -->
  <g>
    <text x="0" y="0" font-size="20" text-anchor="middle">🪖</text>
    <animateMotion dur="3s" repeatCount="indefinite" path="M24,24 L150,90 L24,24"/>
    <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.4;0.5;1" dur="3s" repeatCount="indefinite"/>
  </g>
  <text x="24" y="16" font-size="8" fill="#B39DDB" text-anchor="middle">ARMY</text>

  <!-- Navy stream (top-right) -->
  <g>
    <text x="0" y="0" font-size="20" text-anchor="middle">⚓</text>
    <animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M276,24 L150,90 L276,24"/>
    <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.4;0.5;1" dur="3s" begin="0.5s" repeatCount="indefinite"/>
  </g>
  <text x="276" y="16" font-size="8" fill="#7FE7F0" text-anchor="middle">NAVY</text>

  <!-- Air Force stream (bottom) -->
  <g>
    <text x="0" y="0" font-size="20" text-anchor="middle">✈️</text>
    <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M150,160 L150,90 L150,160"/>
    <animate attributeName="opacity" values="1;1;0.2;1" keyTimes="0;0.4;0.5;1" dur="3s" begin="1s" repeatCount="indefinite"/>
  </g>
  <text x="150" y="176" font-size="8" fill="#FFE08A" text-anchor="middle">AIR FORCE</text>

  <!-- Indian flag corner badge -->
  <g transform="translate(258,10)">
    <rect x="0" y="0" width="30" height="6" fill="#FF9933"/>
    <rect x="0" y="6" width="30" height="6" fill="#FFFFFF"/>
    <rect x="0" y="12" width="30" height="6" fill="#138808"/>
    <circle cx="15" cy="9" r="2.3" fill="none" stroke="#000080" stroke-width="0.5"/>
    <circle cx="15" cy="9" r="0.6" fill="#000080"/>
  </g>
</svg>
