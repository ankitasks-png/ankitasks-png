<svg viewBox="0 0 300 180" width="240" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="petHubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8A2BE2" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8A2BE2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="300" height="180" fill="#0f0c29" rx="12"/>

  <!-- connecting lines from hub to pet slots -->
  <line x1="150" y1="90" x2="60" y2="40" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="150" y1="90" x2="240" y2="40" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="150" y1="90" x2="60" y2="140" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>
  <line x1="150" y1="90" x2="240" y2="140" stroke="#8A2BE2" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.4"/>

  <!-- hub glow -->
  <circle cx="150" cy="90" r="30" fill="url(#petHubGlow)">
    <animate attributeName="r" values="24;34;24" dur="2s" repeatCount="indefinite"/>
  </circle>

  <!-- hub core -->
  <circle cx="150" cy="90" r="16" fill="#302b63" stroke="#8A2BE2" stroke-width="2"/>
  <text x="150" y="96" font-size="16" text-anchor="middle">🐾</text>

  <!-- Dog (top-left) -->
  <g>
    <text x="0" y="0" font-size="22" text-anchor="middle">🐶</text>
    <animateMotion dur="3s" repeatCount="indefinite" path="M150,90 L60,40 L150,90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="3s" repeatCount="indefinite"/>
  </g>

  <!-- Cat (top-right) -->
  <g>
    <text x="0" y="0" font-size="22" text-anchor="middle">🐱</text>
    <animateMotion dur="3s" begin="0.4s" repeatCount="indefinite" path="M150,90 L240,40 L150,90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="3s" begin="0.4s" repeatCount="indefinite"/>
  </g>

  <!-- Bird (bottom-left) -->
  <g>
    <text x="0" y="0" font-size="22" text-anchor="middle">🐦</text>
    <animateMotion dur="3s" begin="0.8s" repeatCount="indefinite" path="M150,90 L60,140 L150,90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="3s" begin="0.8s" repeatCount="indefinite"/>
  </g>

  <!-- Rabbit (bottom-right) -->
  <g>
    <text x="0" y="0" font-size="22" text-anchor="middle">🐰</text>
    <animateMotion dur="3s" begin="1.2s" repeatCount="indefinite" path="M150,90 L240,140 L150,90"/>
    <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.7;1" dur="3s" begin="1.2s" repeatCount="indefinite"/>
  </g>
</svg>
