<svg width="720" height="360" viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0c29"/>
      <stop offset="55%" stop-color="#1b1642"/>
      <stop offset="100%" stop-color="#24243e"/>
    </linearGradient>
    <linearGradient id="panelStroke" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A2BE2"/>
      <stop offset="100%" stop-color="#00F0FF"/>
    </linearGradient>
    <radialGradient id="planetGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="planetBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#5b21b6"/>
    </linearGradient>
    <filter id="softBlur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="720" height="360" rx="18" fill="url(#bg)"/>

  <!-- starfield -->
  <g fill="#ffffff">
    <circle cx="40" cy="30" r="1.4" opacity="0.8"/>
    <circle cx="90" cy="70" r="1" opacity="0.5"/>
    <circle cx="150" cy="25" r="1.6" opacity="0.7"/>
    <circle cx="210" cy="55" r="1" opacity="0.4"/>
    <circle cx="620" cy="40" r="1.6" opacity="0.8"/>
    <circle cx="660" cy="90" r="1" opacity="0.5"/>
    <circle cx="580" cy="20" r="1.2" opacity="0.6"/>
    <circle cx="30" cy="200" r="1.2" opacity="0.5"/>
    <circle cx="55" cy="300" r="1.4" opacity="0.7"/>
    <circle cx="20" cy="330" r="1" opacity="0.4"/>
    <circle cx="670" cy="240" r="1.4" opacity="0.6"/>
    <circle cx="690" cy="310" r="1" opacity="0.5"/>
    <circle cx="640" cy="330" r="1.6" opacity="0.7"/>
    <circle cx="330" cy="18" r="1" opacity="0.5"/>
    <circle cx="480" cy="15" r="1.2" opacity="0.6"/>
  </g>

  <!-- distant ringed planet, top right -->
  <g transform="translate(645,55)">
    <circle r="34" fill="url(#planetGlow)"/>
    <circle r="16" fill="url(#planetBody)"/>
    <ellipse cx="0" cy="0" rx="27" ry="7" fill="none" stroke="#00F0FF" stroke-width="1.5" opacity="0.6" transform="rotate(-18)"/>
  </g>

  <!-- outer HUD panel -->
  <rect x="24" y="24" width="672" height="312" rx="14" fill="none" stroke="url(#panelStroke)" stroke-width="1.5" opacity="0.8"/>
  <rect x="24" y="24" width="672" height="312" rx="14" fill="none" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>

  <!-- header bar -->
  <text x="48" y="58" font-family="Fira Code, Consolas, monospace" font-size="12" letter-spacing="3" fill="#00F0FF" opacity="0.85">MISSION PROFILE // CREW-01</text>
  <line x1="48" y1="68" x2="672" y2="68" stroke="#8A2BE2" stroke-width="0.75" opacity="0.5"/>

  <!-- floating astronaut silhouette, left -->
  <g transform="translate(115,195)">
    <ellipse cx="0" cy="95" rx="60" ry="10" fill="#00F0FF" opacity="0.08"/>
    <!-- backpack -->
    <rect x="-24" y="-18" width="48" height="60" rx="14" fill="#d8d8f0" opacity="0.9"/>
    <!-- body -->
    <path d="M-32,-30 Q-38,20 -18,55 Q0,68 18,55 Q38,20 32,-30 Q0,-46 -32,-30 Z" fill="#f4f4fb"/>
    <path d="M-32,-30 Q-38,20 -18,55 Q0,68 18,55 Q38,20 32,-30 Q0,-46 -32,-30 Z" fill="none" stroke="#8A2BE2" stroke-width="1.2" opacity="0.5"/>
    <!-- helmet -->
    <circle cx="0" cy="-55" r="30" fill="#f4f4fb"/>
    <circle cx="0" cy="-55" r="30" fill="none" stroke="#8A2BE2" stroke-width="1.2" opacity="0.5"/>
    <circle cx="4" cy="-57" r="19" fill="#1b1642"/>
    <circle cx="-3" cy="-64" r="5" fill="#00F0FF" opacity="0.85"/>
    <path d="M-14,-70 Q4,-84 22,-70" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.35"/>
    <!-- arms -->
    <path d="M-32,-15 Q-58,-2 -50,26 Q-46,34 -36,28" fill="#f4f4fb" stroke="#8A2BE2" stroke-width="1" opacity="0.9"/>
    <path d="M32,-15 Q58,4 46,32 Q40,42 30,34" fill="#f4f4fb" stroke="#8A2BE2" stroke-width="1" opacity="0.9"/>
    <!-- legs -->
    <path d="M-18,52 Q-26,80 -14,96 Q-4,100 -2,90 Q-6,68 -6,54 Z" fill="#f4f4fb" stroke="#8A2BE2" stroke-width="1" opacity="0.9"/>
    <path d="M18,52 Q28,78 18,96 Q8,100 6,90 Q10,68 8,54 Z" fill="#f4f4fb" stroke="#8A2BE2" stroke-width="1" opacity="0.9"/>
    <!-- tether -->
    <path d="M-24,-6 C-70,10 -95,60 -80,110" fill="none" stroke="#00F0FF" stroke-width="1" stroke-dasharray="3 4" opacity="0.5"/>
    <!-- badge -->
    <circle cx="0" cy="0" r="8" fill="#8A2BE2" opacity="0.9"/>
    <path d="M-4,0 L0,-4 L4,0 L0,4 Z" fill="#00F0FF"/>
  </g>

  <!-- data panel, right -->
  <g font-family="Fira Code, Consolas, monospace" fill="#e7e6f5">
    <text x="235" y="105" font-size="18" fill="#ffffff" font-weight="bold">Ankita S.</text>
    <text x="235" y="126" font-size="12" fill="#00F0FF" opacity="0.9">BTech CSE · PES University, Bangalore</text>

    <text x="235" y="160" font-size="11" letter-spacing="2" fill="#8A2BE2" opacity="0.9">FOCUS AREAS</text>
    <rect x="235" y="170" width="150" height="24" rx="12" fill="#8A2BE2" opacity="0.18" stroke="#8A2BE2" stroke-width="0.75"/>
    <text x="250" y="186" font-size="11">Software Development</text>
    <rect x="395" y="170" width="118" height="24" rx="12" fill="#00F0FF" opacity="0.14" stroke="#00F0FF" stroke-width="0.75"/>
    <text x="410" y="186" font-size="11">Machine Learning</text>
    <rect x="235" y="200" width="118" height="24" rx="12" fill="#00F0FF" opacity="0.14" stroke="#00F0FF" stroke-width="0.75"/>
    <text x="250" y="216" font-size="11">CyberSecurity</text>

    <text x="235" y="252" font-size="11" letter-spacing="2" fill="#8A2BE2" opacity="0.9">OBSESSION</text>
    <text x="235" y="270" font-size="12" fill="#ffffff">Quantum Computing 🌀</text>

    <text x="235" y="296" font-size="11" letter-spacing="2" fill="#8A2BE2" opacity="0.9">STATUS</text>
    <circle cx="242" cy="308" r="4" fill="#39ff88"/>
    <text x="252" y="312" font-size="12" fill="#ffffff">always_debugging</text>
  </g>

  <!-- footer quote strip -->
  <rect x="48" y="332" width="624" height="0" fill="none"/>
  <text x="48" y="330" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#00F0FF" opacity="0.9">&gt; connect() → "Let's build something intelligent together 🚀"</text>
</svg>
