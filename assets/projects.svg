  </path>
  <path d="M 582 10.799999999999999 L 592 39.0 L 580 39.0 L 596 79.2 L 566 49.0 L 580 49.0 L 568 10.799999999999999 Z" fill="#8A2BE2" filter="url(#glow)" opacity="0.9">
