  <path d="M 38 10.799999999999999 L 28 39.0 L 40 39.0 L 24 79.2 L 54 49.0 L 40 49.0 L 52 10.799999999999999 Z" fill="#8A2BE2" filter="url(#glow)" opacity="0.9">
